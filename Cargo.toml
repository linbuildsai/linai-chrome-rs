[package]
name = "linai-chrome-rs"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of huashu-chrome: let any MCP-capable AI agent drive your own Chrome, with all your logins already in it. Bridge daemon + MCP server + CLI, protocol-compatible with the original Node.js implementation."
license = "MIT"
repository = "https://github.com/linbuildsai/linai-chrome-rs"
keywords = ["mcp", "chrome", "browser-automation", "agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "linai-chrome-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "time", "signal", "process", "sync", "fs"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
libc = "0.2"
dirs = "5"
chrono = "0.4"
regex = "1"
once_cell = "1"
url = "2"
base64 = "0.22"
anyhow = "1"

[profile.release]
strip = true
lto = true
